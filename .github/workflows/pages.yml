name: Deploy Site

on:
  push:
  schedule:
    - cron: '*/30 * * * *'

  workflow_dispatch:

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      API_URL: https://api.cobalt.seika.computer
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          args: --accept-dns=false
          ping: seika

      - name: Get API Commit
        id: commit
        shell: bash -e -o pipefail {0}
        run: |
          commit=$(curl -fsSL --retry 5 --retry-delay 5 ${{ env.API_URL }} | jq -r .git.commit)
          echo "commit=${commit}" >> ${GITHUB_OUTPUT}

      - name: Clone imputnet/cobalt
        uses: actions/checkout@v7
        with:
          repository: imputnet/cobalt
          ref: ${{ steps.commit.outputs.commit }}

      - name: Set Up pnpm
        uses: pnpm/action-setup@v6

      - name: Compile Custom CSS
        run: | 
          curl -fsSL https://raw.githubusercontent.com/catppuccin/userstyles/refs/heads/main/styles/cobalt/catppuccin.user.less \
          | pnpx less --global-var="lightFlavor=latte" --global-var="darkFlavor=mocha" --global-var="accentColor=mauve" - web/static/catppuccin.css

      - name: Inject Custom CSS
        shell: python
        run: |
          from pathlib import Path

          css_file = Path("web/static/catppuccin.css")
          css_file.write_text(css_file.read_text().replace('@-moz-document domain("cobalt.tools") {', "", 1)[::-1].replace("}", "", 1)[::-1])
          
          app_html = Path("web/src/app.html")
          app_html.write_text(app_html.read_text().replace("</head>", f'<link rel="stylesheet" href="%sveltekit.assets%/catppuccin.css"></head>'))

          theme_file = Path("web/src/lb/state/theme")
          theme_file.write_text(theme_file.read_text().replace("#000000", "#1e1e2e").replace("#ffffff", "#eff1f5"))
          
      - name: Build Site
        run: pnpm install --filter @imput/cobalt-web && pnpm build --filter @imput/cobalt-web
        working-directory: web
        env:
          WEB_DEFAULT_API: ${{ env.API_URL }}
          WEB_HOST: https://cobalt.seika.computer

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/build

  deploy:
    name: Deploy Site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
